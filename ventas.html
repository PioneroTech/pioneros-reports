<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ventas · Pioneros Reports</title>
<link rel="stylesheet" href="shared/theme.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
<div id="root"></div>
<script src="shared/core.js"></script>
<script src="shared/dashboard.js"></script>
<script src="shared/ventas-model.js"></script>
<script>
PR.createDashboard({
  name: 'Ventas',
  dropTitle: 'Cargá el informe “Ventas detalladas”',
  searchPlaceholder: 'Producto o cliente…',
  tableTitle: 'Venta detallada por producto',
  entity: { singular: 'Cliente', rankTitle: 'Principales clientes' },
  mustHave: ['Cliente', 'Subtotal c/ IVA'],
  normalize: PR.normalizeVentas,
  tipoFilter: ['Productos', 'Servicios'], rankStack: true,
  kpiTiles: (K, { delta, yearTotal }) => [
    [PR.fmt.compact(K.usd), 'Ventas c/IVA USD', delta],
    [PR.fmt.compact(K.ars), 'Ventas c/IVA $', ''],
    [PR.fmt.int(K.tc), 'Tipo de cambio (pond.)', ''],
    [PR.fmt.int(K.ents), 'Clientes', ''],
    [PR.fmt.compact(K.factProm), 'Factura promedio USD', `<div class="d">${PR.fmt.int(K.facturas)} facturas</div>`],
    [yearTotal ? PR.fmt.pct(K.usd / yearTotal * 100) : '–', '% del total del año', ''],
  ],
  note: 'El informe viene en USD (incluso las líneas cuya moneda original es Peso); el importe en pesos = USD × cotización del comprobante. Las notas de crédito restan. ' +
        'Servicios = rubro ' + PR.SERVICE_RUBROS.join(', ') + '; el resto se considera Productos.',
});
</script>
</body>
</html>
