<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pioneros Reports</title>
<link rel="stylesheet" href="shared/theme.css">
<style>
  .home { max-width: 760px; margin: 0 auto; padding: 48px 16px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-top: 28px; }
  .card { display: block; padding: 22px; border: 1px solid var(--border); border-radius: var(--r); background: var(--surface); color: inherit; text-decoration: none; }
  .card:hover { border-color: var(--accent); }
  .card h2 { margin: 0 0 6px; font-size: 20px; }
  .card p { margin: 0; color: var(--ink-2); }
  .soon { opacity: .55; pointer-events: none; }
</style>
</head>
<body>
<main class="home">
  <div class="brand">Pioneros Reports</div>
  <h1>Tableros</h1>
  <p style="color:var(--ink-2)">Elegí un tablero y cargá el informe de Synagro. Los archivos se leen en tu navegador y no se suben a ningún servidor.</p>
  <div class="cards">
    <a class="card" href="ventas.html"><h2>Ventas</h2><p>Informe “Ventas detalladas”</p></a>
    <a class="card" href="compras.html"><h2>Compras</h2><p>Informe “Compras detalladas en Peso”</p></a>
    <div class="card soon"><h2>Resultados</h2><p>Próximamente</p></div>
  </div>
</main>
</body>
</html>
